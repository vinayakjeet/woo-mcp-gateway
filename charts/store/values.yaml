# Installer sets slug and storeName (Makefile or provisioner).
slug: main
storeName: Main Store

global:
  domain: 127.0.0.1.nip.io
  scheme: http
  imageTag: dev

images:
  # Empty means images imported into k3d with no registry prefix.
  registry: ''
  wordpress: store-wordpress
  wooMcp: woo-mcp
  mariadb: mariadb:11.4.13

ingress:
  className: traefik
  tls:
    enabled: false
    clusterIssuer: ''

storage:
  className: local-path
  mariadb: 2Gi
  wordpress: 2Gi

admin:
  user: admin
  email: admin@example.com

wordpress:
  environmentType: local

# Passed by the installer from deploy/secrets/store-<slug>.yaml; woo-mcp uses it after M1.
mcp:
  sharedToken: ''

wooMcp:
  # Only these pods may call woo-mcp (NetworkPolicy matrix). The platform chart (M3) must label the gateway to match.
  gateway:
    namespace: platform
    podLabels:
      app.kubernetes.io/name: gateway

networkPolicy:
  # Traefik in k3s (NetworkPolicy matrix). Besides this store's woo-mcp, only these pods may open the storefront.
  ingressController:
    namespace: kube-system
    podLabels:
      app.kubernetes.io/name: traefik

# Store provisioner. Production stores use 2Gi + 2Gi volumes (a deliberate change from the original 10Gi sizing), which fits 8Gi.
quota:
  requestsCpu: '1'
  requestsMemory: 1536Mi
  limitsCpu: 3500m
  limitsMemory: 2304Mi
  persistentVolumeClaims: 3
  requestsStorage: 8Gi
  pods: 10
