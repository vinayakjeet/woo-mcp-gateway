# NetworkPolicy matrix, inside one store. A peer that names no namespace means this namespace only, so pods of
# another store match no rule. Default deny and egress rules are in networkpolicy-defaults.yaml and
# networkpolicy-egress.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wordpress-ingress
  labels:
    {{- include "store.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: wordpress
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressController.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressController.podLabels | nindent 14 }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: woo-mcp
      ports:
        # Policies match the pod port. The Service maps 80 to Apache's 8080.
        - port: 8080
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mariadb-ingress
  labels:
    {{- include "store.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: mariadb
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [wordpress, bootstrap, cron]
      ports:
        - port: 3306
          protocol: TCP
