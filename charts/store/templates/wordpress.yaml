apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wordpress-html
  labels:
    {{- include "store.labels" . | nindent 4 }}
    app.kubernetes.io/component: wordpress
  # Kept like the MariaDB PVC and the Secrets, so a reinstall never pairs the old database with empty uploads.
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.storage.className }}
  resources:
    requests:
      storage: {{ .Values.storage.wordpress }}
---
apiVersion: v1
kind: Service
metadata:
  name: wordpress
  labels:
    {{- include "store.labels" . | nindent 4 }}
    app.kubernetes.io/component: wordpress
spec:
  selector:
    {{- include "store.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: wordpress
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  labels:
    {{- include "store.labels" . | nindent 4 }}
    app.kubernetes.io/component: wordpress
spec:
  replicas: 1
  # ReadWriteOnce volume: the old pod must stop before the new one mounts it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "store.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: wordpress
  template:
    metadata:
      labels:
        {{- include "store.labels" . | nindent 8 }}
        app.kubernetes.io/component: wordpress
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
        fsGroup: 33
        seccompProfile:
          type: RuntimeDefault
      # local-path plus fsGroup leaves the volume root owned by root with setgid, and the
      # official entrypoint's tar copy aborts when it cannot chmod that directory. A uid 33
      # owned subdirectory avoids it.
      initContainers:
        - name: prepare-html
          image: {{ include "store.image" (list . .Values.images.wordpress) }}
          imagePullPolicy: IfNotPresent
          command:
            - mkdir
            - -p
            - /volume/html
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          volumeMounts:
            - name: html
              mountPath: /volume
      containers:
        - name: wordpress
          image: {{ include "store.image" (list . .Values.images.wordpress) }}
          imagePullPolicy: IfNotPresent
          ports:
            # The image moves Apache to 8080 so uid 33 can bind it; the Service exposes 80.
            - name: http
              containerPort: 8080
          env:
            {{- include "store.wordpressEnv" . | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /healthz.php
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz.php
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: html
              mountPath: /var/www/html
              subPath: html
      volumes:
        - name: html
          persistentVolumeClaim:
            claimName: wordpress-html
