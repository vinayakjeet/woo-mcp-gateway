{{- $token := required "mcp.sharedToken is required (make store writes it to deploy/secrets/store-<slug>.yaml)" .Values.mcp.sharedToken -}}
apiVersion: v1
kind: Service
metadata:
  name: woo-mcp
  labels:
    app.kubernetes.io/name: woo-mcp
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: woo-mcp
    urumi.io/store: {{ .Values.slug | quote }}
spec:
  selector:
    app.kubernetes.io/name: woo-mcp
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: woo-mcp
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: woo-mcp
  labels:
    app.kubernetes.io/name: woo-mcp
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: woo-mcp
    urumi.io/store: {{ .Values.slug | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: woo-mcp
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: woo-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: woo-mcp
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: woo-mcp
        urumi.io/store: {{ .Values.slug | quote }}
      annotations:
        checksum/token: {{ $token | sha256sum | trunc 16 }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: woo-mcp
          image: {{ include "store.image" (list . .Values.images.wooMcp) }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: WC_BASE_URL
              value: http://wordpress.{{ .Release.Namespace }}.svc.cluster.local
            # WooCommerce rebuilds the signature base string from its home URL, not from the Host header.
            # The scheme comes from is_ssl() on the request it receives. This hop is plain http even when the
            # public site is https, so sign with http or WooCommerce answers "Invalid signature".
            - name: WC_SIGNING_BASE_URL
              value: {{ printf "http://%s" (include "store.host" .) | quote }}
            - name: WC_CONSUMER_KEY
              valueFrom: { secretKeyRef: { name: store-wc-api, key: WC_CONSUMER_KEY } }
            - name: WC_CONSUMER_SECRET
              valueFrom: { secretKeyRef: { name: store-wc-api, key: WC_CONSUMER_SECRET } }
            - name: MCP_SHARED_TOKEN
              valueFrom: { secretKeyRef: { name: store-mcp-token, key: MCP_SHARED_TOKEN } }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { cpu: 250m, memory: 192Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
