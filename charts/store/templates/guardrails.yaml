# Store guardrails. Worst case is every workload at its limit while the bootstrap Job runs and a
# wp-cron tick fires: 768 + 512 + 192 + 384 + 256 = 2112Mi of limits.memory. The original sizing says 2Gi, which
# left the cron pod out (added in M10) and refused the first tick; 2304Mi is the deliberate deviation.
# limits.cpu in the same worst case is 1000 + 1000 + 250 + 500 + 250 = 3000m, so 3500m leaves room for
# netpol-check probe pods (100m). scripts/store-quota-sum.py checks both sums and requires 200m of CPU
# and 128Mi of memory to stay free.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: store-quota
  labels:
    {{- include "store.labels" . | nindent 4 }}
spec:
  hard:
    requests.cpu: {{ .Values.quota.requestsCpu | quote }}
    requests.memory: {{ .Values.quota.requestsMemory }}
    limits.cpu: {{ .Values.quota.limitsCpu | quote }}
    limits.memory: {{ .Values.quota.limitsMemory }}
    persistentvolumeclaims: {{ .Values.quota.persistentVolumeClaims | quote }}
    requests.storage: {{ .Values.quota.requestsStorage }}
    pods: {{ .Values.quota.pods | quote }}
---
# With a limits quota every pod must declare limits; these defaults cover probe pods and anything
# else that omits them.
apiVersion: v1
kind: LimitRange
metadata:
  name: store-limits
  labels:
    {{- include "store.labels" . | nindent 4 }}
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        cpu: 500m
        memory: 256Mi
      max:
        cpu: "1"
        memory: 1Gi
