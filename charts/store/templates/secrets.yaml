{{- $ns := .Release.Namespace -}}
{{- $db := (get (lookup "v1" "Secret" $ns "store-db") "data") | default dict -}}
{{- $wp := (get (lookup "v1" "Secret" $ns "store-wp") "data") | default dict -}}
{{- $wc := (get (lookup "v1" "Secret" $ns "store-wc-api") "data") | default dict -}}
apiVersion: v1
kind: Secret
metadata:
  name: store-db
  labels:
    {{- include "store.labels" . | nindent 4 }}
  annotations:
    # The MariaDB PVC outlives the release; a new password would lock WordPress out.
    helm.sh/resource-policy: keep
type: Opaque
data:
  MARIADB_ROOT_PASSWORD: {{ include "store.secretValue" (list $db "MARIADB_ROOT_PASSWORD" (randAlphaNum 32)) | quote }}
  MARIADB_PASSWORD: {{ include "store.secretValue" (list $db "MARIADB_PASSWORD" (randAlphaNum 32)) | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: store-wp
  labels:
    {{- include "store.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  WP_ADMIN_USER: {{ include "store.secretValue" (list $wp "WP_ADMIN_USER" .Values.admin.user) | quote }}
  WP_ADMIN_PASSWORD: {{ include "store.secretValue" (list $wp "WP_ADMIN_PASSWORD" (randAlphaNum 24)) | quote }}
  {{- range list "AUTH_KEY" "SECURE_AUTH_KEY" "LOGGED_IN_KEY" "NONCE_KEY" "AUTH_SALT" "SECURE_AUTH_SALT" "LOGGED_IN_SALT" "NONCE_SALT" }}
  WORDPRESS_{{ . }}: {{ include "store.secretValue" (list $wp (printf "WORDPRESS_%s" .) (randAlphaNum 64)) | quote }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: store-wc-api
  labels:
    {{- include "store.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  # sha1sum of random input gives exactly 40 hex characters.
  WC_CONSUMER_KEY: {{ include "store.secretValue" (list $wc "WC_CONSUMER_KEY" (printf "ck_%s" (randAlphaNum 64 | sha1sum))) | quote }}
  WC_CONSUMER_SECRET: {{ include "store.secretValue" (list $wc "WC_CONSUMER_SECRET" (printf "cs_%s" (randAlphaNum 64 | sha1sum))) | quote }}
{{- if .Values.mcp.sharedToken }}
---
apiVersion: v1
kind: Secret
metadata:
  name: store-mcp-token
  labels:
    {{- include "store.labels" . | nindent 4 }}
type: Opaque
data:
  MCP_SHARED_TOKEN: {{ .Values.mcp.sharedToken | b64enc | quote }}
{{- end }}
