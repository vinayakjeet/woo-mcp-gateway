global:
  domain: 127.0.0.1.nip.io
  scheme: http
  imageTag: dev

images:
  # Empty means images imported into k3d with no registry prefix.
  registry: ''
  controlPlane: control-plane
  gateway: gateway
  fxMcp: fx-mcp
  web: web
  agent: agent
  postgres: postgres:17-alpine

ingress:
  className: traefik
  tls:
    enabled: false
    clusterIssuer: ''

gateway:
  # Browser origins allowed to call /mcp. Empty means <scheme>://app.<domain>.
  allowedOrigins: []

agent:
  # OpenAI-compatible chat completions. Each environment's values file sets these (SPEC 28).
  # Keys come from Secret agent-llm: LLM_API_KEY for the primary, LLM_FALLBACK_API_KEY for the fallback.
  # The agent exits at start, naming the missing variables, while baseUrl or model is empty.
  llm:
    baseUrl: ''
    model: ''
    # Empty turns the fallback off.
    fallbackBaseUrl: ''
    fallbackModel: ''
    # Sent as reasoning_effort to both providers to keep thinking tokens small. Empty leaves it out.
    reasoningEffort: low

storage:
  className: local-path
  postgres: 2Gi

bootstrap:
  adminEmail: admin@example.com

# Passed by the installer from deploy/secrets/store-main.yaml. The same file feeds charts/store.
mcp:
  sharedToken: ''

seed:
  stores:
    - slug: main
      name: Main Store
      namespace: store-main

# Turn on with the provisioner (M5): it mounts the ServiceAccount token into the control-plane.
provisioner:
  enabled: false

fxMcp:
  slug: fx
  name: Currency
