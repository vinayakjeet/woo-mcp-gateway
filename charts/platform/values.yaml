global:
  domain: 127.0.0.1.nip.io
  scheme: http
  imageTag: dev

images:
  # Empty means images imported into k3d with no registry prefix.
  registry: ''
  controlPlane: control-plane
  gateway: gateway
  fxMcp: fx-mcp
  web: web
  agent: agent
  postgres: postgres:17-alpine

ingress:
  className: traefik
  tls:
    enabled: false
    clusterIssuer: ''

gateway:
  # Browser origins allowed to call /mcp. Empty means <scheme>://app.<domain>.
  allowedOrigins: []
  # Lets an admin add http:// MCP servers (SPEC 22.1). The control-plane check and the gateway's
  # connect-time check read the same value. Private, loopback, link-local and cluster addresses
  # stay refused either way. Keep false in production.
  allowInsecureUpstreams: false
  # Tool calls per minute for a key without its own limit, and for the agent (SPEC 19).
  rateLimitPerMinute: 60

agent:
  # auto, search or full. Auto lets the gateway switch to search mode above 40 visible tools (SPEC 17).
  # search and full force the mode with ?toolMode= on the gateway URL.
  toolMode: auto
  # OpenAI-compatible chat completions. Each environment's values file sets these (SPEC 28).
  # Keys come from Secret agent-llm: LLM_API_KEY for the primary, LLM_FALLBACK_API_KEY for the fallback.
  # The agent exits at start, naming the missing variables, while baseUrl or model is empty.
  llm:
    baseUrl: ''
    model: ''
    # Empty turns the fallback off.
    fallbackBaseUrl: ''
    fallbackModel: ''
    # Sent as reasoning_effort to both providers to keep thinking tokens small. Empty leaves it out.
    reasoningEffort: low

storage:
  className: local-path
  postgres: 2Gi

bootstrap:
  adminEmail: admin@example.com

# Passed by the installer from deploy/secrets/store-main.yaml. The same file feeds charts/store.
mcp:
  sharedToken: ''

seed:
  stores:
    - slug: main
      name: Main Store
      namespace: store-main

# SPEC 18 (M9): the control-plane provisions stores with the helm CLI. Turning it on also mounts
# the ServiceAccount token and creates the ClusterRole.
provisioner:
  enabled: false
  maxStoresPerUser: 3
  # Per-store settings. global, images.registry, ingress and storage.className above apply too,
  # so one environment file configures the platform and every store it creates.
  store:
    storage:
      mariadb: 2Gi
      wordpress: 2Gi
    environmentType: local

# SPEC 21 (M11): hosted MCP servers run in mcp-hosted. An admin can only submit an image that starts with
# one of these prefixes. Each entry ends with "/" or ":" so "ghcr.io/acme/" cannot admit "ghcr.io/acme-evil/".
# Empty refuses every create. The caps bound the limits an admin may request.
hosted:
  allowedImagePrefixes: []
  maxCpu: 500m
  maxMemory: 256Mi

fxMcp:
  slug: fx
  name: Currency

networkPolicy:
  # Traefik in k3s (SPEC 16). The same shape as the store chart.
  ingressController:
    namespace: kube-system
    podLabels:
      app.kubernetes.io/name: traefik
