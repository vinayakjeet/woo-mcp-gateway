{{- if .Values.provisioner.enabled }}
# SPEC 18. Helm 4's --wait uses kstatus, which lists and watches everything it installs.
# M10 narrows this to store-* and mcp-hosted with a ValidatingAdmissionPolicy.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-provisioner
  labels:
    {{- include "platform.labels" (list . "control-plane") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources:
      - namespaces
    verbs: [get, list, watch, create, patch, delete]
  - apiGroups: [""]
    resources:
      - services
      - configmaps
      - secrets
      - persistentvolumeclaims
      - resourcequotas
      - limitranges
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources:
      - deployments
      - statefulsets
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources:
      - jobs
    verbs: [get, list, watch, create, update, patch, delete]
      - cronjobs
  - apiGroups: [networking.k8s.io]
    resources:
      - ingresses
      - networkpolicies
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources:
      - pods
      - events
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources:
      - replicasets
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-provisioner
  labels:
    {{- include "platform.labels" (list . "control-plane") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-provisioner
subjects:
  - kind: ServiceAccount
    name: control-plane
    namespace: {{ .Release.Namespace }}
{{- end }}
