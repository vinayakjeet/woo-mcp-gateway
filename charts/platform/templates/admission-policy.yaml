{{- if .Values.provisioner.enabled }}
# Store provisioner and admission policy. The provisioner ClusterRole is wide because Helm's --wait lists and watches
# everything it installs. This policy is the narrow part: the control-plane may only write inside
# store-* namespaces and mcp-hosted, and may only create, change or delete those Namespace objects.
# Reads are not matched, so the control-plane can still look at any namespace.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: control-plane-namespaces
  labels:
    {{- include "platform.labels" (list . "control-plane") | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["*"]
        apiVersions: ["*"]
        operations:
          - CREATE
          - UPDATE
          - DELETE
        resources: ["*/*"]
        scope: "*"
  matchConditions:
    - name: from-control-plane
      expression: "request.userInfo.username == 'system:serviceaccount:{{ .Release.Namespace }}:control-plane'"
  variables:
    - name: isNamespace
      expression: "request.resource.group == '' && request.resource.resource == 'namespaces'"
    # A Namespace object is named by its own name; everything else by request.namespace. A delete
    # carries no object, so it reads oldObject. Cluster-scoped kinds other than Namespace end up as ''.
    - name: target
      expression: >-
        variables.isNamespace
        ? (request.operation == 'DELETE' ? oldObject.metadata.name : object.metadata.name)
        : request.namespace
  validations:
    - expression: "variables.target.startsWith('store-') || variables.target == 'mcp-hosted'"
      messageExpression: >-
        'the control-plane may only write to store-* and mcp-hosted, not '
        + (variables.target == '' ? 'cluster-scoped ' + request.resource.resource : variables.target)
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: control-plane-namespaces
  labels:
    {{- include "platform.labels" (list . "control-plane") | nindent 4 }}
spec:
  policyName: control-plane-namespaces
  validationActions:
    - Deny
{{- end }}
