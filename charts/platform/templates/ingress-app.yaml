apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app
  labels:
    {{- include "platform.labels" (list . "control-plane") | nindent 4 }}
  {{- if .Values.ingress.tls.enabled }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - app.{{ .Values.global.domain }}
      secretName: app-tls
  {{- end }}
  rules:
    - host: app.{{ .Values.global.domain }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: control-plane
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 8080
