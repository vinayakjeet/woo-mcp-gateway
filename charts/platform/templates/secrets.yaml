{{- $ns := .Release.Namespace -}}
{{- $dbData := (get (lookup "v1" "Secret" $ns "platform-db") "data") | default dict -}}
{{- $cryptoData := (get (lookup "v1" "Secret" $ns "platform-crypto") "data") | default dict -}}
{{- $bootData := (get (lookup "v1" "Secret" $ns "platform-bootstrap") "data") | default dict -}}
{{- $fxData := (get (lookup "v1" "Secret" $ns "fx-mcp-token") "data") | default dict -}}
{{- $storeToken := required "mcp.sharedToken is required (run make store first, then pass -f deploy/secrets/store-main.yaml)" .Values.mcp.sharedToken -}}
{{- $pw := include "platform.secretValue" (list $dbData "POSTGRES_PASSWORD" (randAlphaNum 32)) -}}
{{- $fxToken := include "platform.secretValue" (list $fxData "MCP_SHARED_TOKEN" (randAlphaNum 48)) | b64dec -}}
{{- $servers := list -}}
{{- range .Values.seed.stores -}}
{{- $servers = append $servers (dict "slug" .slug "name" .name "url" (printf "http://woo-mcp.%s.svc.cluster.local:8080/mcp" .namespace) "kind" "store" "managed" true "protocolMode" "auto" "auth" (dict "type" "bearer" "secret" $storeToken)) -}}
{{- end -}}
{{- $servers = append $servers (dict "slug" .Values.fxMcp.slug "name" .Values.fxMcp.name "url" (printf "http://fx-mcp.%s.svc.cluster.local:8080/mcp" $ns) "kind" "system" "managed" true "protocolMode" "auto" "auth" (dict "type" "bearer" "secret" $fxToken)) -}}
apiVersion: v1
kind: Secret
metadata:
  name: platform-db
  labels:
    {{- include "platform.labels" (list . "postgres") | nindent 4 }}
  annotations:
    # The Postgres PVC outlives the release; a new password would lock the services out.
    helm.sh/resource-policy: keep
type: Opaque
data:
  POSTGRES_PASSWORD: {{ $pw | quote }}
  DATABASE_URL: {{ include "platform.secretValue" (list $dbData "DATABASE_URL" (printf "postgres://platform:%s@postgres:5432/platform" ($pw | b64dec))) | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: platform-crypto
  labels:
    {{- include "platform.labels" (list . "control-plane") | nindent 4 }}
  annotations:
    # A new KEK would make every stored upstream secret unreadable.
    helm.sh/resource-policy: keep
type: Opaque
data:
  # The env var holds base64 of 32 bytes (the security hardening rules), so the 32 random characters are encoded once here and again by secretValue.
  KEK: {{ include "platform.secretValue" (list $cryptoData "KEK" (randAlphaNum 32 | b64enc)) | quote }}
  API_KEY_PEPPER: {{ include "platform.secretValue" (list $cryptoData "API_KEY_PEPPER" (randAlphaNum 48)) | quote }}
  JWT_SIGNING_KEY: {{ include "platform.secretValue" (list $cryptoData "JWT_SIGNING_KEY" (randAlphaNum 64)) | quote }}
  INTERNAL_SECRET: {{ include "platform.secretValue" (list $cryptoData "INTERNAL_SECRET" (randAlphaNum 48)) | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: platform-bootstrap
  labels:
    {{- include "platform.labels" (list . "control-plane") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  ADMIN_EMAIL: {{ include "platform.secretValue" (list $bootData "ADMIN_EMAIL" .Values.bootstrap.adminEmail) | quote }}
  ADMIN_PASSWORD: {{ include "platform.secretValue" (list $bootData "ADMIN_PASSWORD" (randAlphaNum 24)) | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: platform-seed
  labels:
    {{- include "platform.labels" (list . "control-plane") | nindent 4 }}
type: Opaque
data:
  SEED_SERVERS: {{ toJson $servers | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: fx-mcp-token
  labels:
    {{- include "platform.labels" (list . "fx-mcp") | nindent 4 }}
type: Opaque
data:
  MCP_SHARED_TOKEN: {{ $fxToken | b64enc | quote }}
