{{- if .Values.monitoring.enabled }}
# One Prometheus, no Grafana, no Ingress and no Service: reach it with kubectl port-forward.
# It finds gateway replicas through the headless gateway-metrics Service, so it has no Kubernetes
# API access and no ServiceAccount token. The data is an emptyDir: history is lost on a restart.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus
  labels:
    {{- include "platform.labels" (list . "prometheus") | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
    scrape_configs:
      - job_name: gateway
        dns_sd_configs:
          - names:
              - gateway-metrics.{{ .Release.Namespace }}.svc.cluster.local
            type: A
            port: 9090
      - job_name: control-plane
        static_configs:
          - targets:
              - control-plane-internal.{{ .Release.Namespace }}.svc.cluster.local:3001
{{- end }}
