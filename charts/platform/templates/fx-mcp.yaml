apiVersion: v1
kind: Service
metadata:
  name: fx-mcp
  labels:
    {{- include "platform.labels" (list . "fx-mcp") | nindent 4 }}
spec:
  selector:
    {{- include "platform.selectorLabels" (list . "fx-mcp") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fx-mcp
  labels:
    {{- include "platform.labels" (list . "fx-mcp") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "platform.selectorLabels" (list . "fx-mcp") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "platform.labels" (list . "fx-mcp") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "platform.nodePodSecurity" . | nindent 8 }}
      containers:
        - name: fx-mcp
          image: {{ include "platform.image" (list . .Values.images.fxMcp) }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: MCP_SHARED_TOKEN
              valueFrom: { secretKeyRef: { name: fx-mcp-token, key: MCP_SHARED_TOKEN } }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
          securityContext:
            {{- include "platform.nodeContainerSecurity" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
