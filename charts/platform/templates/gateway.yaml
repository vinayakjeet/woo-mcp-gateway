apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    {{- include "platform.labels" (list . "gateway") | nindent 4 }}
spec:
  {{- if not .Values.gateway.hpa.enabled }}
  replicas: {{ .Values.gateway.replicas | int }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "platform.selectorLabels" (list . "gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "platform.labels" (list . "gateway") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      # preStop sleep 5 s, then SIGTERM and a drain of at most 5 s, with a margin. The pause lets
      # Traefik and the EndpointSlice drop the pod before it stops listening.
      terminationGracePeriodSeconds: 15
      securityContext:
        {{- include "platform.nodePodSecurity" . | nindent 8 }}
      containers:
        - name: gateway
          image: {{ include "platform.image" (list . .Values.images.gateway) }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: health
              containerPort: 9090
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: platform-db, key: DATABASE_URL } }
            - name: KEK
              valueFrom: { secretKeyRef: { name: platform-crypto, key: KEK } }
            - name: API_KEY_PEPPER
              valueFrom: { secretKeyRef: { name: platform-crypto, key: API_KEY_PEPPER } }
            - name: JWT_SIGNING_KEY
              valueFrom: { secretKeyRef: { name: platform-crypto, key: JWT_SIGNING_KEY } }
            - name: GATEWAY_URL
              value: {{ include "platform.gatewayUrl" . | quote }}
            - name: ALLOWED_ORIGINS
              value: {{ include "platform.gatewayAllowedOrigins" . | quote }}
            - name: ALLOW_INSECURE_UPSTREAMS
              value: {{ .Values.gateway.allowInsecureUpstreams | default false | toString | quote }}
            - name: OAUTH_ENABLED
              value: {{ .Values.oauth.enabled | default false | toString | quote }}
            {{- if .Values.oauth.enabled }}
            - name: OAUTH_ISSUER
              value: {{ include "platform.oauthIssuer" . | quote }}
            {{- end }}
            - name: RATE_LIMIT_PER_MINUTE
              value: {{ .Values.gateway.rateLimitPerMinute | int | quote }}
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          readinessProbe:
            httpGet: { path: /readyz, port: 9090 }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: 9090 }
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: "1", memory: 384Mi }
          securityContext:
            {{- include "platform.nodeContainerSecurity" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    {{- include "platform.labels" (list . "gateway") | nindent 4 }}
spec:
  selector:
    {{- include "platform.selectorLabels" (list . "gateway") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Headless, so Prometheus finds every replica through DNS and needs no Kubernetes API access.
# Nothing else uses it, and no Ingress routes port 9090.
apiVersion: v1
kind: Service
metadata:
  name: gateway-metrics
  labels:
    {{- include "platform.labels" (list . "gateway") | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "platform.selectorLabels" (list . "gateway") | nindent 4 }}
  ports:
    - name: health
      port: 9090
      targetPort: health
