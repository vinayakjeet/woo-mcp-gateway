apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    {{- include "platform.labels" (list . "gateway") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "platform.selectorLabels" (list . "gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "platform.labels" (list . "gateway") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "platform.nodePodSecurity" . | nindent 8 }}
      containers:
        - name: gateway
          image: {{ include "platform.image" (list . .Values.images.gateway) }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: health
              containerPort: 9090
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: platform-db, key: DATABASE_URL } }
            - name: KEK
              valueFrom: { secretKeyRef: { name: platform-crypto, key: KEK } }
            - name: API_KEY_PEPPER
              valueFrom: { secretKeyRef: { name: platform-crypto, key: API_KEY_PEPPER } }
            - name: JWT_SIGNING_KEY
              valueFrom: { secretKeyRef: { name: platform-crypto, key: JWT_SIGNING_KEY } }
            - name: GATEWAY_URL
              value: {{ printf "%s://mcp.%s/mcp" .Values.global.scheme .Values.global.domain | quote }}
            - name: ALLOWED_ORIGINS
              value: {{ include "platform.gatewayAllowedOrigins" . | quote }}
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          readinessProbe:
            httpGet: { path: /readyz, port: 9090 }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: 9090 }
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: "1", memory: 384Mi }
          securityContext:
            {{- include "platform.nodeContainerSecurity" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    {{- include "platform.labels" (list . "gateway") | nindent 4 }}
spec:
  selector:
    {{- include "platform.selectorLabels" (list . "gateway") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
