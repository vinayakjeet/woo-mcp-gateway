# SPEC 16: the control-plane reaches its state and the Kubernetes API. k3s serves the API on the
# node IP at 6443 after the Service DNAT, so the rule names ports and no address.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: control-plane-egress
  labels:
    {{- include "platform.labels" (list . "control-plane") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "platform.selectorLabels" (list . "control-plane") | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "platform.selectorLabels" (list . "postgres") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 6443
        - protocol: TCP
          port: 443
