apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp
  labels:
    {{- include "platform.labels" (list . "gateway") | nindent 4 }}
  {{- if .Values.ingress.tls.enabled }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - mcp.{{ .Values.global.domain }}
      secretName: mcp-tls
  {{- end }}
  rules:
    - host: mcp.{{ .Values.global.domain }}
      http:
        paths:
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
