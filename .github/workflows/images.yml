name: images

# Builds the seven platform images and pushes them to ghcr.io/vinayakjeet/<name>:<version>-<sha>.
# A tag vX.Y.Z gives version X.Y.Z. A manual run takes the version as an input.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for the image tag, for example 0.1.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/vinayakjeet

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gateway, dockerfile: apps/gateway/Dockerfile, context: . }
          - { name: control-plane, dockerfile: apps/control-plane/Dockerfile, context: . }
          - { name: web, dockerfile: apps/web/Dockerfile, context: . }
          - { name: agent, dockerfile: apps/agent/Dockerfile, context: . }
          - { name: woo-mcp, dockerfile: servers/woo-mcp/Dockerfile, context: . }
          - { name: fx-mcp, dockerfile: servers/fx-mcp/Dockerfile, context: . }
          - {
              name: store-wordpress,
              dockerfile: images/store-wordpress/Dockerfile,
              context: images/store-wordpress,
            }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Work out the image tag
        id: tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$INPUT_VERSION"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "version '$version' is not X.Y.Z" >&2
            exit 1
          fi
          echo "tag=${version}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.REGISTRY }}/${{ matrix.name }}:${{ steps.tag.outputs.tag }}
          # Links the package to this repo, which lets later runs push with GITHUB_TOKEN.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
