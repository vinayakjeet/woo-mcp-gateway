# Helm values for jetstack/cert-manager v1.21.2. Install:
# helm --kube-context urumi-vm upgrade --install cert-manager jetstack/cert-manager --version v1.21.2 \
#   -n cert-manager --create-namespace -f deploy/cert-manager/values.yaml
# The chart default security contexts are already non-root, RuntimeDefault, drop ALL and read-only root.
crds:
  enabled: true
  keep: true

resources:
  requests: { cpu: 20m, memory: 64Mi }
  limits: { cpu: 200m, memory: 192Mi }

webhook:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 100m, memory: 96Mi }

cainjector:
  resources:
    requests: { cpu: 20m, memory: 96Mi }
    limits: { cpu: 200m, memory: 256Mi }

startupapicheck:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 100m, memory: 64Mi }
