# Template only: the shape of deploy/secrets/store-main-prod.yaml (git-ignored, mode 600). `make store ENV=prod`
# creates that file with a random token the first time, and `make platform ENV=prod` reads the same file,
# so you only write it by hand if you need to replace the token.
# Other secrets are generated by the charts or created with kubectl (see docs/OPERATIONS.md):
#   platform-db, platform-crypto, platform-bootstrap: generated by the platform chart on first install.
#   agent-llm: kubectl -n platform create secret generic agent-llm --from-file=LLM_API_KEY=<file> --from-file=LLM_FALLBACK_API_KEY=<file>
#   ACME contact email: not in git. Put ACME_EMAIL=<address> in deploy/secrets/acme.env; the issuers are rendered from it.
mcp:
  # One token for the store and the platform release. The laptop uses store-main.yaml, a different token.
  sharedToken: '<64 hex characters>'
