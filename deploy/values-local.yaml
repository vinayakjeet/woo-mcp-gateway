global:
  domain: 127.0.0.1.nip.io
  scheme: http
  imageTag: dev

bootstrap:
  adminEmail: admin@example.com

agent:
  llm:
    # Free tiers, checked 2026-10-12. scripts/llm-models.mjs confirms both names from inside the cluster.
    baseUrl: https://generativelanguage.googleapis.com/v1beta/openai/
    model: gemini-3.5-flash-lite
    fallbackBaseUrl: https://api.groq.com/openai/v1
    fallbackModel: openai/gpt-oss-120b

# Stores from the dashboard (SPEC 18, M9).
gateway:
  # Roomy for demos and e2e; the chart default is 60.
  rateLimitPerMinute: 120

provisioner:
  enabled: true

# Hosted servers (SPEC 21, M11). The local fx-mcp image is imported into k3d with no registry.
hosted:
  allowedImagePrefixes: ['fx-mcp:']
